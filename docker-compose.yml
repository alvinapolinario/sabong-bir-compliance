# LOCAL TESTING ONLY. On the VPS the app runs under systemd behind nginx (see deploy/).
services:
  db:
    image: mariadb:11.4
    container_name: bir-db
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MARIADB_DATABASE: "${DB_NAME}"
      MARIADB_USER: "${DB_USER}"
      MARIADB_PASSWORD: "${DB_PASSWORD}"
      TZ: Asia/Manila
    volumes:
      - bir-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  app:
    image: node:22-bookworm-slim
    container_name: bir-app
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && node scripts/migrate.js && node src/server.js"
    environment:
      HOST: 0.0.0.0
      DB_HOST: db
      TZ: Asia/Manila
    volumes:
      - .:/app
      - bir-node-modules:/app/node_modules
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  bir-db:
  bir-node-modules:
