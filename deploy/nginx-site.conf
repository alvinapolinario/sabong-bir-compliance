# nginx site for the BIR Compliance System. __DOMAIN__ is replaced by setup-ubuntu.sh.
# certbot adds the HTTPS (443) server block and the HTTP→HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    server_tokens off;
    client_max_body_size 25m;

    access_log /var/log/nginx/bir-compliance.access.log;
    error_log  /var/log/nginx/bir-compliance.error.log warn;

    location ~ /\.(?!well-known) { deny all; return 404; }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
